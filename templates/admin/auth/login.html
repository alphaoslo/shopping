{% extends "admin/layouts/auth_base.html" %}

{% block title %}Admin Login | Color Joys Paint Co.{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-5 col-md-7">

            <div class="card shadow-lg border-0 rounded-4">

                <div class="card-body p-5">

                    <div class="text-center mb-4">

                        <h2 class="fw-bold">
                            Admin Login
                        </h2>

                        <p class="text-muted">
                            Sign in to access the Admin Dashboard
                        </p>

                    </div>

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Username or Email
                            </label>

                            <input
                                type="text"
                                name="login"
                                class="form-control"
                                placeholder="Enter username or email"
                                required>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Enter password"
                                required>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-dark w-100">

                            Login

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
